name: Tests

on:
  push:
    branches:
      - main
      - v0.9
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full coverage on Linux x86_64: both modes × all feature variants.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, mode_name: debug, mode_arg: "", features_name: default, features_arg: "" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, mode_name: release, mode_arg: --release, features_name: default, features_arg: "" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, mode_name: debug, mode_arg: "", features_name: fork-resolution, features_arg: "-F fork-resolution" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, mode_name: release, mode_arg: --release, features_name: fork-resolution, features_arg: "-F fork-resolution" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, mode_name: debug, mode_arg: "", features_name: extensions-draft, features_arg: "-F extensions-draft,extensions-draft-test-dependencies" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, mode_name: release, mode_arg: --release, features_name: extensions-draft, features_arg: "-F extensions-draft,extensions-draft-test-dependencies" }
          # Test the storage compatibility feature with and without extensions draft feature
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, mode_name: release, mode_arg: --release, features_name: 0-8-1-storage-format, features_arg: "-F 0-8-1-storage-format" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, mode_name: release, mode_arg: --release, features_name: 0-8-1-storage-format-extensions-draft, features_arg: "-F 0-8-1-storage-format,extensions-draft,extensions-draft-test-dependencies" }
          # Other platforms: debug + default features only.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, mode_name: debug, mode_arg: "", features_name: default, features_arg: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, mode_name: debug, mode_arg: "", features_name: default, features_arg: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, mode_name: debug, mode_arg: "", features_name: default, features_arg: "" }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }} (${{ matrix.mode_name }}/${{ matrix.features_name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1

      - name: Tests
        run: cargo test ${{ matrix.mode_arg }} -p openmls --verbose --no-default-features ${{ matrix.features_arg }}

  compat_tests:
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: "compat_tests"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1

      - name: Tests
        run: ./test.sh



  wasm:
    runs-on: "ubuntu-latest"
    steps:
      # Checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Install toolchain
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown

      # Setup wasm bindings
      - uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: wasm-bindgen-cli
          version: "0.2.129" # Match Cargo.lock exactly.

      - name: Tests Wasm32 on linux
        run: |
          export CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=$HOME/.cargo-install/wasm-bindgen-cli/bin/wasm-bindgen-test-runner
          cargo test -p openmls -vv --target wasm32-unknown-unknown -F js,js-test
