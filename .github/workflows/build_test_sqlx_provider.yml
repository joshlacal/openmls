name: Build & test sqlx storage provider crate

on:
  push:
    branches:
      - main
      - v0.9
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            sqlx_storage -> target
      - name: Build openmls_sqlx_storage
        run: |
          cargo build --manifest-path sqlx_storage/Cargo.toml
      - name: Test openmls_sqlx_storage
        run: |
          cargo test --manifest-path sqlx_storage/Cargo.toml
      - name: Build openmls_sqlx_storage with `extensions-draft` feature
        run: |
          cargo build -F extensions-draft --manifest-path sqlx_storage/Cargo.toml
      - name: Test openmls_sqlx_storage with `extensions-draft` feature
        run: |
          cargo test -F extensions-draft --manifest-path sqlx_storage/Cargo.toml
