name: Spot Fuzz

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'book/**'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'book/**'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        tests:
          - welcome_decode
          - key_package_decode
          - mls_message_decode
          - proposal_decode
          - welcome_decode_bytes
          - key_package_decode_bytes
          - mls_message_decode_bytes
          - proposal_decode_bytes
          - extension_decode_bytes
        include:
          - tests: welcome_decode
            runs: 10000
          - tests: key_package_decode
            runs: 50000
          - tests: mls_message_decode
            runs: 50000
          - tests: proposal_decode
            runs: 50000
          - tests: welcome_decode_bytes
            runs: 10000
          - tests: key_package_decode_bytes
            runs: 50000
          - tests: mls_message_decode_bytes
            runs: 50000
          - tests: proposal_decode_bytes
            runs: 50000
          - tests: extension_decode_bytes
            runs: 50000
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-fuzz@0.13.2
      - run: cargo fuzz run ${{ matrix.tests }} -- -runs=${{ matrix.runs }}
