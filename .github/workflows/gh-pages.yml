name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: '0.5.4'
      - name: Build docs
        run: |
          cd openmls
          RUSTDOCFLAGS="--cfg doc_cfg --cfg docsrs" cargo +nightly doc --all-features --no-deps
          touch ../target/doc/.nojekyll
          cd ..
          mkdir temp_docs
          mv target/doc temp_docs
          cd book
          mdbook build
          cd ..
          mv book/book temp_docs
          cd temp_docs
          cat > index.html <<EOF
          <!doctype html>
          <html>
          <a href="doc/openmls/index.html">Docs</a>
          <a href="book/index.html">Book</a>
          </html>
          EOF
      - name: Deploy docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: temp_docs
          cname: latest.openmls.tech
